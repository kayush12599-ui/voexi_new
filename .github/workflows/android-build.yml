name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'

      - name: 3. Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: 5. Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 6. Install EAS CLI & Build APK
        run: |
          npm install -g eas-cli
          npx eas-cli build --platform android --profile preview --local --non-interactive

      - name: 7. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOEXI-Android-APK
          path: "*.apk"
          if-no-files-found: error
